MainFrame.annotationHelp.chain=<b>Freie Kette (L)</b><br>Linksklick auf Kandidat: Kette verl\u00e4ngern; Shift + Linksklick: Mitglied hinzuf\u00fcgen; Command + Linksklick: einzelner Knoten<br>Linksklick au\u00dferhalb des Gitters / Space: St\u00e4rke der n\u00e4chsten Verbindung wechseln<br>Doppelter Linksklick auf Brett/Zeichenfl\u00e4che: letzte Verbindung umschalten; doppelter Rechtsklick: einmal zur\u00fcckgehen<br>Rechtsklick beliebig / Backspace: letzte Verbindung zur\u00fccknehmen<br>Doppelklick auf denselben bereits verbundenen Kandidaten A, dann Klick auf B: gezielt umschalten (links) oder l\u00f6schen (rechts)<br>Klicks auf verschiedene L-Kandidaten innerhalb des Doppelklickfensters gelten ebenfalls als Doppelklick<br>Linkes Auswahlrechteck: getroffene Verbindungen umschalten; rechtes Auswahlrechteck: Verbindungen und Kettenmarkierungen l\u00f6schen<br>Mausrad: Farbgruppe; Option / mittlere Maustaste halten: Beziehungsvorschau (gr\u00fcn durchgezogen: stark m\u00f6glich, orange gestrichelt: nur schwach; blassrot strichpunktiert: St\u00e4rke zum Verbinden wechseln); Loslassen beendet die Vorschau<br>Nach der Enter-Vorschau, Shift + Enter: Transkription aller Kettenschl\u00fcsse nach P vorbereiten; Farbgruppe und Startpunkte w\u00e4hlen, dann mit Enter die anderen Markierungen ersetzen und die Quellkette entfernen (Sudoku unver\u00e4ndert).

